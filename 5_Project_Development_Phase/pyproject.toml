[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit_card_approval_prediction"
version = "1.0.0"
description = "Enterprise Machine Learning project for predicting credit card approval status."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Mahammad Shariff Shaik", email = "sk.md.shariff143@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "flask>=3.0.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "flask-wtf>=1.2.0",
    "flask-login>=0.6.3",
    "email-validator>=2.0.0",
    "wtforms>=3.1.0",
]

[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''
