name: Python Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FLASK_ENV: testing
  MPLBACKEND: Agg
  SECRET_KEY: ci-testing-secret-key-12345

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pytest-asyncio Flask-Dance
          pip install -e .

      - name: Print Diagnostics
        run: |
          python --version
          pip list | grep -iE "scikit|numpy|xgboost|flask|pandas|imbalanced"
          python -c "import sklearn; print('scikit-learn:', sklearn.__version__)"
          python -c "import numpy; print('numpy:', numpy.__version__)"

      - name: Run Pytest Suite
        run: |
          python -m pytest tests/ --cov=src --cov=app --cov-report=term-missing -v --tb=long 2>&1 | tee pytest_output.log
          echo $? > pytest_exit_code.txt
        continue-on-error: true

      - name: Upload Test Output on Failure
        run: |
          EXIT_CODE=$(cat pytest_exit_code.txt)
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "Pytest failed with exit code $EXIT_CODE."
            if [ -f pytest_output.log ]; then
              echo "Uploading test output to paste.rs..."
              PASTE_URL=$(curl --silent --data-binary @pytest_output.log https://paste.rs/)
              echo "=================================================================="
              echo "   PYTEST DETAILED RESULTS: $PASTE_URL"
              echo "=================================================================="
            fi
            exit "$EXIT_CODE"
          else
            echo "Pytest completed successfully."
          fi
