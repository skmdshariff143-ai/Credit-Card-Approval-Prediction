name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential

    - name: Install Project Packages
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Run Code Linting (Flake8)
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 src/ flask_app/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. Max line length set to 120.
        flake8 src/ flask_app/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

    - name: Run Unit Tests with Coverage (Pytest)
      run: |
        # Run test suite and assert coverage report
        pytest tests/ -v --cov=src --cov=flask_app --cov-report=term-missing
