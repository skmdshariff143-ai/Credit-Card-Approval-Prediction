name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 5_Project_Development_Phase
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black bandit
          pip install -r requirements.txt
          pip install -e .

      - name: Lint with Black
        run: |
          black --check src/ app/ tests/

      - name: Lint with Flake8
        run: |
          # Syntax error check
          flake8 src/ app/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warnings and code length checks
          flake8 src/ app/ tests/ --count --max-complexity=10 --max-line-length=120 --statistics
          ci: remove pass-through overrides
