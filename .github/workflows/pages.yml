name: Rebuild and Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages Site Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages Settings
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Verify Docs Subdirectory Structure
        run: |
          if [ ! -d "./5_Project_Development_Phase/docs" ]; then
            echo "Error: docs/ folder not found!"
            exit 1
          fi
          if [ ! -f "./5_Project_Development_Phase/docs/index.html" ]; then
            echo "Error: docs/index.html not found!"
            exit 1
          fi

      - name: Package and Upload Site Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./5_Project_Development_Phase/docs

  deploy:
    name: Deploy to GitHub Pages Environments
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish Artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
