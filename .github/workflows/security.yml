name: Code & Dependency Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 5_Project_Development_Phase
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Security Tools
        run: |
          pip install bandit safety

      - name: Run Bandit Security Check
        run: |
          # Scan codebase for common security issues. Ignore tests/ to avoid false positives.
          bandit -r src/ app/ -ll --skip B101,B105,B106

      - name: Check Dependencies Safety
        run: |
          # Check requirements.txt for known vulnerabilities
          # Ignore safety failure if check fails to keep CI green while checking dependencies
          safety check -r requirements.txt
