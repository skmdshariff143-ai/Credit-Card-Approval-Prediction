<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreditGuard AI | Reset Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-centering-page">
    <div class="auth-box-card animate-scale-in">
        <div class="auth-header-wrapper">
            <div class="auth-avatar-logo"><i class="fas fa-shield-halved"></i></div>
            <h2>Reset Password</h2>
            <p class="auth-subtitle">Enter a new secure password for your account.</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="toast-alert alert-{{ category if category != 'error' else 'danger' }}" style="margin-bottom:16px;">
                    <i class="fas fa-circle-exclamation"></i>
                    <div class="toast-content">{{ message }}</div>
                </div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label class="form-label" for="password">New Password</label>
                <div class="form-control-icon-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" id="password" class="form-control" placeholder="Enter new password" required minlength="6">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label" for="confirm_password">Confirm Password</label>
                <div class="form-control-icon-wrapper">
                    <i class="fas fa-shield-halved"></i>
                    <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="Confirm new password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-full"><i class="fas fa-key"></i> Reset Password</button>
        </form>

        <div class="auth-footer-prompt">
            <a href="{{ url_for('auth.login') }}"><i class="fas fa-arrow-left"></i> Back to Sign In</a>
        </div>
    </div>
</div>
<script>
    const t = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', t);
</script>
</body>
</html>
