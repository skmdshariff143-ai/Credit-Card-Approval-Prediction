<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreditGuard AI | Register</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="auth-centering-page">
    <div class="auth-box-card animate-scale-in" style="max-width: 480px;">
        <div class="auth-header-wrapper">
            <div class="auth-avatar-logo"><i class="fa-solid fa-user-plus"></i></div>
            <h2 class="h4 fw-bold">Create Account</h2>
            <p class="auth-subtitle">Create a new secure profile for risk evaluations.</p>
        </div>

        <!-- Alerts -->
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="toast-glass alert-danger mb-3 p-2 d-flex align-items-center gap-2">
                    <i class="fa-solid fa-triangle-exclamation text-danger fs-6"></i>
                    <div style="font-size:12px;" class="text-secondary">{{ message }}</div>
                </div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.register') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group mb-3">
                <label class="form-label fs-7 text-secondary fw-semibold mb-1" for="full_name">Full Name</label>
                <div class="form-floating-premium">
                    <i class="fa-solid fa-id-card form-icon-left"></i>
                    <input type="text" name="full_name" id="full_name" class="form-control-premium" placeholder="e.g. Jane Doe" required>
                </div>
            </div>

            <div class="form-group mb-3">
                <label class="form-label fs-7 text-secondary fw-semibold mb-1" for="username">Username</label>
                <div class="form-floating-premium">
                    <i class="fa-solid fa-user form-icon-left"></i>
                    <input type="text" name="username" id="username" class="form-control-premium" placeholder="Choose a username" required>
                </div>
            </div>

            <div class="form-group mb-3">
                <label class="form-label fs-7 text-secondary fw-semibold mb-1" for="email">Email Address</label>
                <div class="form-floating-premium">
                    <i class="fa-solid fa-envelope form-icon-left"></i>
                    <input type="email" name="email" id="email" class="form-control-premium" placeholder="you@company.com" required>
                </div>
            </div>

            <div class="form-group mb-3">
                <label class="form-label fs-7 text-secondary fw-semibold mb-1" for="password">Password</label>
                <div class="form-floating-premium">
                    <i class="fa-solid fa-key form-icon-left"></i>
                    <input type="password" name="password" id="password" class="form-control-premium" placeholder="Create password" required minlength="6">
                </div>
            </div>

            <div class="form-group mb-4">
                <label class="form-label fs-7 text-secondary fw-semibold mb-1" for="confirm_password">Confirm Password</label>
                <div class="form-floating-premium">
                    <i class="fa-solid fa-shield-halved form-icon-left"></i>
                    <input type="password" name="confirm_password" id="confirm_password" class="form-control-premium" placeholder="Re-enter password" required>
                </div>
            </div>

            <button type="submit" class="btn-premium btn-primary w-full py-3">
                <i class="fa-solid fa-user-plus"></i> Register
            </button>
        </form>

        <div class="auth-footer-prompt">
            Already have an account? <a href="{{ url_for('auth.login') }}">Sign In</a>
        </div>
    </div>
</div>

<script>
    const saved = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);
</script>
</body>
</html>
