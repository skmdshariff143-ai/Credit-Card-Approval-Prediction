<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreditGuard AI | Login</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="auth-centering-page">
    <div class="auth-box-card animate-scale-in">
        <div class="auth-header-wrapper">
            <div class="auth-avatar-logo"><i class="fa-solid fa-lock"></i></div>
            <h2 class="h4 fw-bold">Sign In</h2>
            <p class="auth-subtitle">Access your automated credit assessment suite.</p>
        </div>

        <!-- Alerts -->
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="toast-glass alert-danger mb-3 p-2 d-flex align-items-center gap-2">
                    <i class="fa-solid fa-triangle-exclamation text-danger fs-6"></i>
                    <div style="font-size:12px;" class="text-secondary">{{ message }}</div>
                </div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group mb-3">
                <label class="form-label fs-7 text-secondary fw-semibold mb-1" for="username">Username</label>
                <div class="form-floating-premium">
                    <i class="fa-solid fa-user form-icon-left"></i>
                    <input type="text" name="username" id="username" class="form-control-premium" placeholder="Enter username" required autofocus>
                </div>
            </div>

            <div class="form-group mb-4">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label fs-7 text-secondary fw-semibold mb-0" for="password">Password</label>
                    <a href="{{ url_for('auth.forgot_password') }}" class="fs-8">Forgot?</a>
                </div>
                <div class="form-floating-premium">
                    <i class="fa-solid fa-key form-icon-left"></i>
                    <input type="password" name="password" id="password" class="form-control-premium" placeholder="Enter password" required>
                </div>
            </div>

            <button type="submit" class="btn-premium btn-primary w-full py-3">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In
            </button>
        </form>

        <div class="auth-footer-prompt">
            Don't have an account? <a href="{{ url_for('auth.register') }}">Create Account</a>
        </div>
    </div>
</div>

<script>
    const saved = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);
</script>
</body>
</html>
