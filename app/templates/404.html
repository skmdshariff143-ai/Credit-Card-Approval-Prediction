{% extends "base.html" %}
{% block title %}CreditGuard AI — Page Not Found{% endblock %}

{% block content %}
<div class="flex justify-center items-center" style="min-height:70vh;padding:24px;">
  <div class="card card-glass text-center animate-scale-in" style="max-width:480px;padding:40px;">
    <div class="sidebar-logo" style="width:72px;height:72px;font-size:32px;margin:0 auto 24px;border-radius:18px;background:rgba(255,193,7,0.1);color:var(--warning);">
      <i class="fas fa-triangle-exclamation"></i>
    </div>
    
    <h1 class="gradient-text" style="font-size:48px;font-weight:800;line-height:1;">404</h1>
    <h2 class="mb-8" style="font-size:20px;">Resource Not Found</h2>
    <p class="text-secondary mb-24" style="font-size:14px;">
      The page or credit profile you requested is mistyped, expired, or doesn't exist on this risk assessment server.
    </p>
    
    <div class="flex justify-center">
      <a href="{{ url_for('api.index') }}" class="btn btn-primary">
        <i class="fas fa-house"></i> Return to Portal
      </a>
    </div>
  </div>
</div>
{% endblock %}
