{% extends "base.html" %}

        <i class="bi bi-exclamation-octagon text-warning" style="font-size: 6rem;"></i>
        <h1 class="display-3 fw-bold text-dark mt-3">404</h1>

        <a href="{{ url_for('api.index') }}" class="btn btn-primary btn-lg shadow-sm"><i class="bi bi-house-door-fill me-1"></i> Return Home</a>
    </div>
</div>
{% endblock %}
