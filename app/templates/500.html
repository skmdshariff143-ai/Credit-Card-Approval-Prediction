{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 text-center">
        <div class="card card-glass border-0 p-5">
            <div class="card-body">
                <div class="d-inline-flex align-items-center justify-content-center bg-danger-subtle text-danger rounded-circle p-4 mb-3" style="width: 100px; height: 100px;">
                    <i class="bi bi-x-octagon fs-1"></i>
                </div>
                <h1 class="display-3 fw-extrabold text-gradient mt-2">500</h1>
                <h3 class="fw-bold text-secondary mb-3">Internal System Malfunction</h3>
                <p class="text-muted col-md-10 mx-auto mb-4">The scoring server encountered an unexpected failure processing features. Ensure model binaries are trained and serialized properly before launching Flask web services.</p>
                <a href="{{ url_for('api.index') }}" class="btn btn-premium btn-lg shadow"><i class="bi bi-house-door-fill me-1"></i> Return to Portal</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
