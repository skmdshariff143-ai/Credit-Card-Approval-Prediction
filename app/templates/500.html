<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreditGuard AI | Server Error</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-centering-page">
    <div class="auth-box-card animate-scale-in text-center" style="max-width:480px;">
        <div style="font-size:72px;margin-bottom:16px;opacity:0.15;"><i class="fas fa-triangle-exclamation"></i></div>
        <h1 style="font-family:var(--font-heading);font-size:64px;font-weight:800;background:linear-gradient(135deg,var(--danger),var(--warning));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">500</h1>
        <h2 style="font-family:var(--font-heading);font-size:20px;margin:8px 0 12px;">Internal Server Error</h2>
        <p class="text-secondary" style="margin-bottom:24px;">An unexpected condition was encountered. Our engineers have been notified.</p>
        <a href="/" class="btn btn-primary"><i class="fas fa-home"></i> Return to Dashboard</a>
    </div>
</div>
<script>
    const t = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', t);
</script>
</body>
</html>
