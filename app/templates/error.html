{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8 text-center py-5">
        <i class="fa-solid fa-triangle-exclamation text-danger display-1 mb-4 animate-bounce"></i>
        <h1 class="display-4 font-outfit text-white fw-bold">Error {{ error_code }}</h1>
        <p class="lead text-white-50 mt-3">{{ message }}</p>
        
        <div class="mt-5">
            <a href="{{ url_for('api.index') }}" class="btn btn-accent btn-lg px-5 py-3 rounded-pill fw-bold font-outfit shadow-lg"><i class="fa-solid fa-house me-2"></i> Back to Home</a>
        </div>
    </div>
</div>
{% endblock %}
