{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 text-center">
        <div class="card card-glass border-0 p-5">
            <div class="card-body">
                <div class="d-inline-flex align-items-center justify-content-center bg-danger-subtle text-danger rounded-circle p-4 mb-3" style="width: 100px; height: 100px;">
                    <i class="bi bi-exclamation-triangle fs-1"></i>
                </div>
                <h1 class="display-4 fw-extrabold text-gradient mt-2">Error {{ error_code }}</h1>
                <p class="lead text-muted mt-3 mb-4">{{ message }}</p>
                <div class="mt-4">
                    <a href="{{ url_for('api.index') }}" class="btn btn-premium btn-lg shadow"><i class="bi bi-house-door-fill me-2"></i> Back to Home</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
